name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # The compiled binary on a real Windows. The test suite itself is for Linux.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run build bun-windows-x64
      - shell: powershell
        env:
          DOI_SMOKE_RENDER: "1"
        run: |
          $bin = (Get-ChildItem dist\doi-*-windows-x64.exe).FullName
          .\scripts\smoke-binary.ps1 $bin
          .\scripts\test-install.ps1 $bin -ModifyPath
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      # Chromium for the PNG and PDF export tests.
      - run: bun run install-browser --with-deps
      - run: bun test
      - run: bun check
      # The single binary (#63): it builds and runs without Bun on PATH.
      - run: bun run build bun-linux-x64 bun-darwin-arm64
      - run: scripts/smoke-binary.sh dist/doi-*-linux-x64
        env:
          DOI_SMOKE_RENDER: "1"
      - run: scripts/e2e-install.sh dist/doi-*-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: macos-binaries
          path: dist/doi-*-darwin-arm64
          if-no-files-found: error
          retention-days: 3

  macos:
    needs: test
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: macos-binaries
          path: dist
      - name: Require the native CPU
        run: test "$(uname -m)" = arm64
      - name: Check the compiled binary without Bun
        env:
          DOI_SMOKE_RENDER: "1"
        run: |
          chmod +x dist/doi-*-darwin-arm64
          scripts/smoke-binary.sh dist/doi-*-darwin-arm64
      - run: scripts/e2e-install.sh dist/doi-*-darwin-arm64
      - name: Prepare the manual install
        shell: bash
        run: |
          bin=(dist/doi-*-darwin-arm64)
          version=$("${bin[0]}" --version | cut -d' ' -f2)
          mkdir -p "macos-test/release/v$version"
          cp "${bin[0]}" "macos-test/release/v$version/"
          cp scripts/install.sh docs/macos-testing.md macos-test/
          (cd "macos-test/release/v$version" && shasum -a 256 doi-* > SHA256SUMS)
          (cd macos-test && shasum -a 256 install.sh release/v"$version"/doi-* release/v"$version"/SHA256SUMS > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: macos-installation-arm64
          path: macos-test/
          if-no-files-found: error
          retention-days: 30
