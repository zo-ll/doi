name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      # Chromium for the PNG and PDF export tests.
      - run: bun run install-browser --with-deps
      - run: bun test
      - run: bun check
      # The single binary (#63): it builds and runs without Bun on PATH.
      - run: bun run build bun-linux-x64
      - run: scripts/smoke-binary.sh dist/doi-*-linux-x64
