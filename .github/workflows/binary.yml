name: Binary

# The single binary (#63) on macOS. macOS runners cost more minutes, so this runs only when
# the packaging changes, or by hand (Actions → Binary → Run workflow).
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - package.json
      - bun.lock
      - scripts/build.ts
      - scripts/smoke-binary.sh
      - src/server/index.ts
      - src/server/cli.ts
      - src/export/browser.ts
      - .github/workflows/binary.yml

jobs:
  macos:
    runs-on: macos-latest # arm64
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run build bun-darwin-arm64 bun-darwin-x64
      - run: scripts/smoke-binary.sh dist/doi-*-darwin-arm64
      # The x64 binary only builds here: the runner has no Intel CPU.
      - run: file dist/doi-*-darwin-x64 | grep -q 'x86_64'
