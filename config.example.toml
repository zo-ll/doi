# Copy to config.toml. All keys are optional.
#
# The default models use subscriptions through the official CLIs:
#   claude-code:<model>  Claude subscription through `claude -p` (log in with `claude`)
#   codex:<model>        ChatGPT plan through `codex exec` (log in with `codex login`)
# These need no API key. The API providers below are optional. Add a key in Settings
# (system keychain, else ~/.config/doi/credentials.json), or set the variable below; the variable wins.

workspace = "./workspace"
port = 4317

[providers.anthropic]
api_key_env = "ANTHROPIC_API_KEY"

[providers.openai]
api_key_env = "OPENAI_API_KEY"

[providers.opencode-go]
api_key_env = "OPENCODE_API_KEY"
# base_url = "https://opencode.ai/inference/go/v1"
# Wire format per model, when a new model is not in the built-in table:
# formats = { "new-model-id" = "chat" }   # chat | messages | responses

[providers.ollama]
base_url = "http://localhost:11434"

[models]
generate = "claude-code:claude-opus-5-5"   # full designs
edit     = "claude-code:claude-sonnet-5-5" # small targeted edits
extract  = "claude-code:claude-haiku-5-5"  # design system extraction (needs vision for the screenshot import)
# Settings (Ctrl/⌘ + ,) in the app writes these three lines.
# With a ChatGPT plan instead, for example:
# generate = "codex:default"   # "default" uses the model from the Codex config
# With an API key, for example:
# generate = "anthropic:claude-opus-5-5"

# Prices for the usage report, in USD per 1M tokens. Subscriptions and local models show
# tokens only. Without an entry, an API model shows "No price".
# [prices]
# "anthropic:claude-opus-5-5" = { input = 5, output = 25, cached = 0.5 }
# "openai:gpt-6" = { input = 2, output = 8 }
